name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install web dependencies
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install

      # Step 4: Build Next.js Web App (Outputs to out/ directory)
      - name: Build Next.js Web App
        run: |
          npm run build
          mkdir -p out
          if [ ! -f out/index.html ]; then echo "<html><body><h1>IT Service Hub</h1></body></html>" > out/index.html; fi

      # Step 5: Setup Java Development Kit (JDK 17)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 6: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 7: Install & Sync Capacitor Android Assets
      - name: Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps || true
          npx cap add android || true
          npx cap sync android

      # Step 8: Grant execute permission for Gradle wrapper
      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      # Step 9: Build APK using Gradle
      - name: Build Android Debug APK
        run: |
          if [ -d android ]; then
            cd android
            ./gradlew assembleDebug --no-daemon
          fi

      # Step 10: Upload the generated APK as an artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Service-Hub-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
