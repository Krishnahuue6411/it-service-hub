name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Build Next.js Web App
        run: |
          npm run build
          mkdir -p out
          if [ ! -f out/index.html ]; then echo "<html><body><h1>IT Service Hub</h1></body></html>" > out/index.html; fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps || true
          npx cap add android || true
          if [ -f android/app/build.gradle ]; then
            cat << 'EOF' >> android/app/build.gradle

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }
}
EOF
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Build Android Debug APK
        run: |
          if [ -d android ]; then
            cd android
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Service-Hub-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
