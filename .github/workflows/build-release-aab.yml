name: Build & Sign Production AAB

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on release tags like v1.0.0
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Android App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android || true

      - name: Decode Signing Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Build Signed Android App Bundle (.aab)
        run: |
          if [ -d android ]; then
            cd android
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=release-key.jks \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          fi

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Service-Hub-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
